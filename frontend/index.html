<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>super netcentric battleship</title>
  </head>
  <body>
    <div id="app">
        <header>
            <p style="font-weight: bold;" id="current-username"></p>
            <input type="text" id="new-username">
            <button id="change-username-button">Change Username</button>
        </header>
        <div style="display: flex; gap: 2rem">
            <canvas width="500" height="500" style="border: 1px red solid;"></canvas>
            <div>
                <h1>Global Chat</h1>
                <ul id="global-chat"></ul>
                <input type="text" id="current-message">
                <button id="send-to-global-chat-button">Send</button>
            </div>
        </div>
        <div>
            <h1>Active Users</h1>
            <button id="refresh-active-users-button">Refresh</button>
            <ul id="active-users"></ul>
        </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
